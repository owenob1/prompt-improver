name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the suite under the stock /bin/bash 3.2 and BSD userland.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stock /bin/bash (3.2) on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version || echo "jq not installed"

      - name: Make scripts executable
        run: |
          chmod +x tests/smoke-test.sh
          chmod +x skills/prompt-improver/scripts/*.sh
          chmod +x skills/prompt-improver/scripts/backends/*.sh
          chmod +x skills/prompt-improver/scripts/lib/*.sh 2>/dev/null || true

      - name: Run repo smoke tests
        run: bash tests/smoke-test.sh
