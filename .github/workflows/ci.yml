name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the suite under the stock /bin/bash 3.2 and BSD userland.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stock /bin/bash (3.2) on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version || echo "jq not installed"

      - name: Make scripts executable
        run: |
          chmod +x tests/smoke-test.sh
          chmod +x skills/prompt-improver/scripts/*.sh
          chmod +x skills/prompt-improver/scripts/backends/*.sh
          chmod +x skills/prompt-improver/scripts/lib/*.sh 2>/dev/null || true

      - name: Run repo smoke tests
        run: bash tests/smoke-test.sh

  mcp:
    name: MCP server (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            site/package-lock.json

      - name: Install
        run: npm ci

      - name: Install and check the info page
        working-directory: site
        run: npm ci && npx astro check && npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Test (includes parity with the bash validator and assembler)
        run: npm test

      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist
